{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña | Matchball</title>
    <link rel="stylesheet" href="{% static 'torneo/css/login.css' %}">
</head>
<body>
    <main class="login" style="justify-content: center; align-items: center; min-height: 80vh;">
        <section class="login_der" style="width: 100%; max-width: 400px;">
            <h2>Recuperar Contraseña</h2>
            <p style="margin-bottom: 15px; color: #666;">Ingresa el correo asociado a tu cuenta y te enviaremos las instrucciones para restablecer tu contraseña.</p>
            
            <form method="post" class="login_form">
                {% csrf_token %}
                <input type="email" name="email" placeholder="Correo electrónico" required style="padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; width: 100%;">
                <button type="submit" class="btn_login">Enviar instrucciones</button>
            </form>
            <p class="link" style="margin-top: 15px;"><a href="{% url 'login' %}">Volver al inicio de sesión</a></p>
        </section>
    </main>
</body>
</html>
