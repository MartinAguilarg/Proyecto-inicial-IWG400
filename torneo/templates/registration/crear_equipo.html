{% extends 'registration/base.html' %}

{% block content %}
<div style="max-width: 450px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
    <h2 style="margin-top: 0; color: #333;">🛡️ Inscribir Nuevo Equipo</h2>
<p style="color: #666; font-size: 0.9em; margin-bottom: 20px;">Cuéntanos sobre tu equipo. Tu puntaje de Elo inicial depende de la experiencia que elijas.</p>    
    <form method="post" style="display: flex; flex-direction: column; gap: 15px;">
        {% csrf_token %}
        <div style="display: flex; flex-direction: column; gap: 5px;">
            {{ form.as_p }}
        </div>
        <button type="submit" style="background-color: #4CAF50; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1em;">Confirmar e Inscribir Equipo</button>
    </form>
</div>
{% endblock %}
