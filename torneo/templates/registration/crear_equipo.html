{% extends 'registration/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'torneo/css/crear_equipo.css' %}">
{% endblock %}

{% block content %}
<div class="crear-equipo-container">
    <h2 class="crear-equipo-titulo">🛡️ Inscribir Nuevo Equipo</h2>

    <p class="crear-equipo-descripcion">
        Cuéntanos sobre tu equipo. Tu puntaje de Elo inicial depende de la experiencia que elijas.
    </p>

    <form method="post" class="crear-equipo-form">
        {% csrf_token %}
        <div class="crear-equipo-campos">
            {{ form.as_p }}
        </div>

        <button type="submit" class="btn-crear-equipo">
            Confirmar e Inscribir Equipo
        </button>
    </form>
</div>
{% endblock %}
