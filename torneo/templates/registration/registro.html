{% extends 'registration/base.html' %}
{% load static %}

{% block title %}Registro | Matchball{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'torneo/css/registro.css' %}">
{% endblock %}

{% block content %}
<div class="mb-narrow mb-card registro-container">
    <h2 class="registro-title">Registro de capitán</h2>

    <form method="post" class="registro-form">
        {% csrf_token %}

        <!-- Campos generados por Django -->
        <div class="mb-form form-fields">
            {{ form.as_p }}
        </div>

        <button type="submit" class="mb-btn mb-btn--primary mb-btn--block registro-submit">Registrarse</button>
    </form>

    <p class="registro-login">
        ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a>
    </p>
</div>
{% endblock %}
