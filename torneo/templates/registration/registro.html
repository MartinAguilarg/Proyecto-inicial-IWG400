{% extends 'registration/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'torneo/css/registro.css' %}">
{% endblock %}

{% block content %}
<div class="registro-container">
    <h2 class="registro-title">📝 Registro de Capitán</h2>

    <form method="post" class="registro-form">
        {% csrf_token %}

        <!-- Renderizado de campos con los estilos base de Django -->
        <div class="form-fields">
            {{ form.as_p }}
        </div>

        <button type="submit" class="registro-submit">Registrarse</button>
    </form>

    <p class="registro-login">
        ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a>
    </p>
</div>
{% endblock %}
