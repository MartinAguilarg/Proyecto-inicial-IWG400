{% extends 'registration/base.html' %}

{% block content %}
<div style="max-width: 450px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
    <h2 style="margin-top: 0; color: #333;">📝 Registro de Capitán</h2>
    <form method="post" style="display: flex; flex-direction: column; gap: 15px;">
        {% csrf_token %}
        
        <!-- Renderizado de campos con los estilos base de Django -->
        <div class="form-fields">
            {{ form.as_p }}
        </div>
        
        <button type="submit" style="background-color: #4CAF50; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1em;">Registrarse</button>
    </form>
    <p style="text-align: center; margin-top: 15px; font-size: 0.9em;">
        ¿Ya tienes cuenta? <a href="{% url 'login' %}" style="color: #2196F3; text-decoration: none;">Inicia sesión aquí</a>
    </p>
</div>

<style>
    /* Estilos automáticos para los inputs generados por form.as_p */
    .form-fields p {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 12px;
        font-size: 0.95em;
        color: #333;
    }
    .form-fields input, .form-fields select {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1em;
        width: 100%;
        box-sizing: border-box;
    }
    .form-fields helptext, .helptext {
        font-size: 0.8em;
        color: #666;
    }
    .errorlist {
        color: #f44336;
        font-size: 0.85em;
        margin: 0;
        padding-left: 15px;
    }
</style>
{% endblock %}
