{% extends 'registration/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'torneo/css/ranking.css' %}">
{% endblock %}

{% block content %}
<h2>Ranking Global (Elo)</h2>

<table class="ranking-tabla">
    <tr class="ranking-encabezado">
        <th>Pos</th>
        <th>Equipo</th>
        <th>Elo</th>
    </tr>

    {% for equipo in equipos %}
    <tr class="ranking-fila">
        <td>#{{ forloop.counter }}</td>
        <td>
            <strong>
                <a href="{% url 'perfil_equipo' equipo.id %}" class="ranking-enlace">
                    {{ equipo.nombre }}
                </a>
            </strong>
        </td>
        <td>{{ equipo.elo }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
