<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Plataforma de Torneo</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        .navbar { background-color: #333; margin-bottom: 20px; display: flex; }
        .navbar a, .dropbtn { color: white; padding: 15px 20px; text-decoration: none; border: none; background: none; font-size: 16px; cursor: pointer; }
        .navbar a:hover, .dropdown:hover .dropbtn { background-color: #2196F3; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: #f9f9f9; min-width: 220px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1; }
        .dropdown-content a { color: black; padding: 12px 16px; text-decoration: none; display: block; }
        .dropdown-content a:hover { background-color: #ddd; }
        .dropdown:hover .dropdown-content { display: block; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="{% url 'inicio' %}">🏠 Inicio</a>
        {% if user.is_authenticated %}
            <div class="dropdown">
                <button class="dropbtn">⚙️ Menú de Capitán 🔽</button>
                <div class="dropdown-content">
                    <a href="{% url 'ranking' %}">🏆 Ver Ranking Global</a>
                    <a href="{% url 'radar' %}">⚔️ Buscar Partido</a>
                    <a href="{% url 'bandeja_desafios' %}">📩 Bandeja de Entrada</a>
                    <a href="{% url 'calendario' %}">📅 Mi Calendario y Horarios</a>
                    <a href="{% url 'mi_perfil' %}">👤 Mi Perfil</a>
                </div>
            </div>
            <a href="/cuentas/logout/" style="margin-left: auto;">🚪 Salir</a>
        {% else %}
            <a href="{% url 'ranking' %}">🏆 Ranking Global</a>
            <a href="/cuentas/login/" style="margin-left: auto;">Ingresar</a>
        {% endif %}
    </div>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
