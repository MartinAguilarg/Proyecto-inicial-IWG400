{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Contraseña | Matchball</title>
    <link rel="stylesheet" href="{% static 'torneo/css/login.css' %}">
</head>
<body>
    <main class="login" style="justify-content: center; align-items: center; min-height: 80vh;">
        <section class="login_der" style="width: 100%; max-width: 400px;">
            {% if validlink %}
                <h2>Ingresa tu nueva contraseña</h2>
                <form method="post" class="login_form">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn_login" style="margin-top: 15px;">Guardar Nueva Contraseña</button>
                </form>
            {% else %}
                <h2>Enlace no válido</h2>
                <p style="color: #c62828;">El enlace para restablecer la contraseña no es válido o ha expirado.</p>
                <p style="margin-top: 15px;"><a href="{% url 'password_reset' %}">Solicitar un nuevo enlace</a></p>
            {% endif %}
        </section>
    </main>
</body>
</html>
